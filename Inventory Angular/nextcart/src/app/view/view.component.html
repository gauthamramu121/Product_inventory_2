<div class="detail-container">

  <div class="back-nav">
    <button class="back-button" (click)="return()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Back to products
    </button>
  </div>

  <div class="detail-card">
    <div class="detail-grid">

      <div class="image-section">
        <div class="image-frame">
          <img *ngIf="product.imageName" [src]="IMAGE_URL + product.imageName" [alt]="product.productName"
            class="product-image" />
          <div *ngIf="!product.imageName" class="image-placeholder">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="2" y="2" width="20" height="20" rx="2.18" />
              <circle cx="8.5" cy="8.5" r="2.5" />
              <path d="M21 15l-5-4-3 3-4-4-5 5" />
            </svg>
            <span>No image available</span>
          </div>
        </div>
      </div>

      <div class="details-section">
        <div class="status-badge" [attr.data-status]="product.status.toLowerCase()">
          <span class="status-dot"></span>
          {{ product.status }}
        </div>

        <h1 class="product-name">{{ product.productName }}</h1>

        <div class="brand-info">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path
              d="M20 7h-4.18A3 3 0 0 0 16 5.18V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z" />
            <path d="M16 5.18V7h2.82" />
          </svg>
          <span>{{ product.brand }}</span>
        </div>

        <div class="price-section">
          <span class="price-label">Price</span>
          <div class="price-value">
            <span class="currency">$</span>
            <span class="amount">{{ product.price | number:'1.2-2' }}</span>
          </div>
        </div>

        <div class="description-section" *ngIf="product.description">
          <span class="description-label">Description</span>
          <p class="description-text">
            {{ product.description }}
          </p>
        </div>

        <div class="stock-section">
          <div class="stock-info">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
            </svg>
            <span>Stock: <strong>{{ product.stock }} units</strong></span>
          </div>
          <div class="added-date">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <span>Added on: {{ product.addedOn | date:'mediumDate' }}</span>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn-secondary" (click)="update(product.productId)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
            </svg>
            Edit
          </button>
          <button class="btn-secondary" (click)="return()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Go back
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
